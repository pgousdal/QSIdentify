[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsidentify"
version = "0.1.0"
description = "Read-only identification and diagnostics for Quansheng radios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "QSIdentify contributors" }
]
dependencies = [
  "pyserial>=3.5",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10"
]

[project.scripts]
qsidentify = "qsidentify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qsidentify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qsidentify"]
mypy_path = "src"
