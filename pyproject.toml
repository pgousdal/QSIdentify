[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsidentify"
dynamic = ["version"]
description = "Read-only identification, diagnostics, and evidence tooling for programmable radios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "QSIdentify contributors" }]
keywords = ["ham-radio", "radio", "serial", "hardware-identification", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Ham Radio",
]
dependencies = [
  "pyserial>=3.5",
  "typer>=0.12",
  "rich>=13.7",
]
[project.urls]
Homepage = "https://github.com/pgousdal/QSIdentify"
Repository = "https://github.com/pgousdal/QSIdentify"
Issues = "https://github.com/pgousdal/QSIdentify/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyserial>=3.5",
  "build>=1.2",
]

[project.scripts]
qsidentify = "qsidentify.cli:app"

[tool.hatch.version]
path = "src/qsidentify/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qsidentify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qsidentify"]
mypy_path = "src"
